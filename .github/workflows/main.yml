name: CI (Code Quality & Build Check)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer avhengigheter
        run: npm ci

      - name: TypeScript type-sjekk (Strict)
        run: npm run tsc -- --noEmit
        # Dette sikrer at workflows feiler dersom noen har brukt 'any' eller har datatype-feil

      - name: Kjør linter (Kodekvalitet)
        run: npm run lint
        continue-on-error: false

      - name: Bygg prosjektet (Vite Production Build)
        run: npm run build
