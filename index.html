<!DOCTYPE html><html lang="nb"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Grok Prompt Builder</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0d0d0d;color:#e8e8e8;font-family:system-ui,sans-serif}.chip{transition:all.15s;cursor:pointer;padding:8px 18px;background:#1a1a1a;border:1px solid #333;border-radius:9999px;margin:4px}.chip.selected{border-color:#e2c27d;background:rgba(226,194,125,.12);color:#e2c27d;box-shadow:0 0 0 2px rgba(226,194,125,.3)}.result-box{animation:fadeIn .4s}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style></head><body class="min-h-screen p-6"><div class="max-w-md mx-auto"><div class="flex items-center gap-3 mb-8"><div class="w-8 h-8 bg-gradient-to-br from-[#e2c27d] to-[#c9a84c] rounded-xl flex items-center justify-center text-xl">✦</div><div><div class="font-bold text-2xl">Grok Prompt Builder</div><div class="text-xs text-gray-500">Perfekte prompts til Grok Imagine</div></div></div><div id="cats" class="space-y-8"></div><textarea id="custom" rows="3" class="w-full mt-6 bg-[#1a1a1a] border border-[#333] rounded-2xl p-4 text-sm" placeholder="Skriv egen beskrivelse her..."></textarea><button onclick="generate()" class="w-full mt-6 bg-gradient-to-r from-[#e2c27d] to-[#c9a84c] text-black font-bold py-5 rounded-3xl text-lg">Generer prompt</button><div id="result" class="hidden mt-10 result-box bg-[#1a1a1a] rounded-3xl p-6"><div class="flex justify-between mb-4"><span class="font-semibold text-[#e2c27d]">Din prompt</span><button onclick="copyPrompt()" class="text-xs bg-[#333] px-5 py-2 rounded-2xl">📋 Kopier</button></div><div id="promptText" class="bg-[#0d0d0d] p-5 rounded-2xl text-sm whitespace-pre-wrap font-mono"></div></div></div><script>const cats=[{n:"Emne",c:["Portrett","Landskap","Sci-fi","Fantasy","Anime"]},{n:"Stil",c:["Fotorealistisk","Oljemaleri","Cyberpunk","Studio Ghibli"]},{n:"Belysning",c:["Golden hour","Neon","Cinematic","Moonlight"]}];function render(){const d=document.getElementById("cats");d.innerHTML="";cats.forEach(cat=>{const div=document.createElement("div");div.innerHTML=`<div class="text-sm text-gray-400 mb-3">${cat.n}</div><div class="flex flex-wrap gap-2" id="c-${cat.n}"></div>`;d.appendChild(div);const cd=div.querySelector(`#c-${cat.n}`);cat.c.forEach(t=>{const chip=document.createElement("div");chip.className="chip";chip.textContent=t;chip.onclick=()=>chip.classList.toggle("selected");cd.appendChild(chip)})};function generate(){let p="A highly detailed ";cats.forEach(cat=>{const sel=Array.from(document.querySelectorAll(`#c-${cat.n} .selected`)).map(e=>e.textContent);if(sel.length)p+=sel.join(", ")+", "});const cust=document.getElementById("custom").value.trim();if(cust)p+=cust+", ";p=p.slice(0,-2)+" --ar 16:9 --stylize 750 --v 6";document.getElementById("promptText").textContent=p;document.getElementById("result").classList.remove("hidden")};function copyPrompt(){navigator.clipboard.writeText(document.getElementById("promptText").textContent).then(()=>{const b=document.querySelector("#result button");const orig=b.textContent;b.textContent="✅ Kopiert!";setTimeout(()=>b.textContent=orig,2000)})};render();</script></body></html>
